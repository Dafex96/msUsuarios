spring:
  application:
    name: msUsuarios
  datasource:
    url: jdbc:h2:mem:usuarios;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

usuarios:
  datos-prueba:
    habilitado: true
  recuperacion:
    minutos-expiracion: 10
    max-intentos: 3
    exponer-codigo: true
